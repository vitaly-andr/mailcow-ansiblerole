---

mailcow__hostname: "{{ inventory_hostname }}"

mailcow__install_path: "/opt/mailcow-dockerized"
mailcow__git_repo: 'https://github.com/mailcow/mailcow-dockerized.git'
mailcow__git_version: master

mailcow__timezone: Europe/Berlin

mailcow__docker_compose_project_name: mailcowdockerized

# Change theme (default: lumen)
# Needs to be one of those: cerulean, cosmo, cyborg, darkly, flatly, journal, lumen, paper, readable, sandstone,
# simplex, slate, spacelab, superhero, united, yeti
# See https://bootswatch.com/
# WARNING: Only lumen is loaded locally. Enabling any other theme, will download external sources.
mailcow__theme: lumen

mailcow__install_updates: true

mailcow__redirect_http_to_https: false

# MailCow admin password (should be set via environment variable)
mailcow_admin_password: "{{ mailcow_admin_password | default('moohoo123') }}"

mailcow__rspamd_clamd_servers: clamd:3310

# Change this to "docker-compose" if you use the standalone version of compose
mailcow__compose_command: docker compose

# Force restart of MailCow containers (default: false)
# Set to true only when you need to restart containers during deployment
mailcow__force_restart: false

# Update admin password (default: false)
# Set to true only when you need to change admin password
mailcow__update_admin_password: false

# Update MailCow configuration (default: false)
# Set to true only when you need to update config files
mailcow__update_config: false

# Allow removal of corrupted MySQL volume (default: false)
# DANGER: Set to true only if you have backups and want to allow automatic removal of corrupted MySQL volumes
# This will cause complete data loss of the corrupted volume!
mailcow__allow_corrupted_volume_removal: false
